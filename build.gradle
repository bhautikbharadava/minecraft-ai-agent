plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'application'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "mcagent" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Dev-only navigation backend so the agent can mine during runClient.
    // Drop a Baritone build for your Minecraft version into libs/ (gitignored).
    if (file('libs/baritone-meteor-26.2.jar').exists()) {
        runtimeOnly files('libs/baritone-meteor-26.2.jar')
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

application {
    mainClass = 'dev.minecraftai.agent.AgentCli'
}

tasks.register('validateAgentCommands', JavaExec) {
    group = 'verification'
    description = 'Runs smoke checks for agent command handling.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.minecraftai.agent.AgentCli'
    args 'validate'
}

check.dependsOn tasks.named('validateAgentCommands')
